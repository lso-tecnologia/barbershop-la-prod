<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0a0a0a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF0CD"/>
      <stop offset="25%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#AA771C"/>
      <stop offset="100%" stop-color="#583C08"/>
    </linearGradient>
    <linearGradient id="metalPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242424"/>
      <stop offset="50%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="#0A0A0A"/>
  <circle cx="256" cy="256" r="230" fill="url(#goldGlow)"/>

  <!-- Outer Ring with Golden Border -->
  <circle cx="256" cy="256" r="220" fill="url(#metalPlate)" stroke="url(#goldGradient)" stroke-width="6"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#goldGradient)" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>

  <!-- Crossed Razors / Scissors Motif in Gold -->
  <g transform="translate(256, 210) scale(1.15)">
    <!-- Barber Pole Center -->
    <rect x="-24" y="-70" width="48" height="140" rx="8" fill="#1A1A1A" stroke="url(#goldGradient)" stroke-width="3"/>
    <!-- Stripes -->
    <clipPath id="poleClip">
      <rect x="-24" y="-70" width="48" height="140" rx="8"/>
    </clipPath>
    <g clip-path="url(#poleClip)">
      <line x1="-30" y1="-80" x2="30" y2="-20" stroke="#E11D48" stroke-width="14"/>
      <line x1="-30" y1="-40" x2="30" y2="20" stroke="#F8FAFC" stroke-width="14"/>
      <line x1="-30" y1="0" x2="30" y2="60" stroke="#2563EB" stroke-width="14"/>
      <line x1="-30" y1="40" x2="30" y2="100" stroke="#E11D48" stroke-width="14"/>
      <line x1="-30" y1="80" x2="30" y2="140" stroke="#F8FAFC" stroke-width="14"/>
    </g>
    <!-- Pole Caps -->
    <circle cx="0" cy="-76" r="14" fill="url(#goldGradient)"/>
    <rect x="-28" y="-73" width="56" height="8" rx="2" fill="url(#goldGradient)"/>
    <rect x="-28" y="65" width="56" height="8" rx="2" fill="url(#goldGradient)"/>
    <circle cx="0" cy="76" r="14" fill="url(#goldGradient)"/>

    <!-- Left Razor -->
    <path d="M-80 30 Q -60 -10 -20 -30 L -10 -15 Q -45 5 -65 45 Z" fill="url(#goldGradient)"/>
    <!-- Right Razor -->
    <path d="M80 30 Q 60 -10 20 -30 L 10 -15 Q 45 5 65 45 Z" fill="url(#goldGradient)"/>
  </g>

  <!-- Typography: BARBERSHOP L.A -->
  <text x="256" y="375" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', serif, system-ui" font-size="34" font-weight="900" letter-spacing="4" fill="url(#goldGradient)">
    BARBERSHOP L.A
  </text>
  <text x="256" y="410" text-anchor="middle" font-family="'Inter', sans-serif" font-size="14" font-weight="600" letter-spacing="6" fill="#C5A059" opacity="0.9">
    BARUERI • SP
  </text>

  <!-- Star accents -->
  <polygon points="120,368 123,376 131,376 125,381 127,389 120,384 113,389 115,381 109,376 117,376" fill="url(#goldGradient)"/>
  <polygon points="392,368 395,376 403,376 397,381 399,389 392,384 385,389 387,381 381,376 389,376" fill="url(#goldGradient)"/>
</svg>
